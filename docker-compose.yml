version: "3.8"

services:
  # ============================================================
  # Infrastructure
  # ============================================================
  postgres:
    image: postgres:16-alpine
    container_name: ticketing-postgres
    environment:
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing_secret
      POSTGRES_DB: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketing"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing-network

  redis:
    image: redis:7-alpine
    container_name: ticketing-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ticketing-network

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: ticketing-rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ticketing-network

  # ============================================================
  # Microservices
  # ============================================================
  event-service:
    build:
      context: ./apps/event-service
      dockerfile: Dockerfile
    container_name: ticketing-event-service
    environment:
      ENVIRONMENT: development
      EVENT_SERVICE_PORT: "8082"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USER: ticketing
      POSTGRES_PASSWORD: ticketing_secret
      EVENT_DB_NAME: event_db
      POSTGRES_SSL_MODE: disable
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
    restart: on-failure
    networks:
      - ticketing-network

  # ============================================================
  # Observability (Phase 13)
  # ============================================================
  # prometheus:
  #   image: prom/prometheus:v2.51.0
  #   container_name: ticketing-prometheus
  #   ports:
  #     - "9090:9090"
  #   volumes:
  #     - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
  #   networks:
  #     - ticketing-network

  # grafana:
  #   image: grafana/grafana:10.4.0
  #   container_name: ticketing-grafana
  #   ports:
  #     - "3001:3000"
  #   environment:
  #     GF_SECURITY_ADMIN_PASSWORD: admin
  #   networks:
  #     - ticketing-network

volumes:
  postgres_data:

networks:
  ticketing-network:
    driver: bridge
